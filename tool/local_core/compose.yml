name: collectarr-ui-core

x-core: &core
  image: ghcr.io/collectarr/collectarr-core:1.0.0
  environment: &environment
    ENVIRONMENT: development
    SECRET_KEY: collectarr-isolated-ui-test-only
    DATABASE_URL: postgresql+asyncpg://collectarr:collectarr@postgres:5432/collectarr_ui_test
    REDIS_URL: redis://redis:6379/0
    MEILI_URL: http://meilisearch:7700
    MEILI_MASTER_KEY: collectarr-ui-test
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY_ID: collectarr-ui-test
    S3_SECRET_ACCESS_KEY: collectarr-ui-test-only
    S3_BUCKET: collectarr-images
    S3_PUBLIC_URL: http://127.0.0.1:9002/collectarr-images
    BOOTSTRAP_ADMIN_EMAILS: '["ui-test@example.com"]'
    CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:8084","http://127.0.0.1:8084"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collectarr
      POSTGRES_PASSWORD: collectarr
      POSTGRES_DB: collectarr_ui_test
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U collectarr -d collectarr_ui_test]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: collectarr-ui-test
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - search:/meili_data
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: collectarr-ui-test
      MINIO_ROOT_PASSWORD: collectarr-ui-test-only
    ports:
      - 127.0.0.1:9002:9000
    volumes:
      - images:/data
  schema:
    <<: *core
    command: python -m app.scripts.bootstrap_schema
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *core
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    ports:
      - 127.0.0.1:8010:8000
    depends_on:
      schema:
        condition: service_completed_successfully
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
  worker:
    <<: *core
    command: python -m app.worker.main
    depends_on:
      api:
        condition: service_started

volumes:
  postgres:
  search:
  images:
