name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files are clean
        run: git diff --exit-code

      - name: Check library kind boundaries
        run: dart run tool/check_library_kind_boundaries.dart

      - name: Analyze
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Run unit and widget tests
        run: flutter test

      - name: Run integration smoke tests
        run: flutter test integration_test/app_smoke_test.dart

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release
