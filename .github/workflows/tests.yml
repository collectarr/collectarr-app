name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job runs one stage of tool/ci_check.dart, the script that runs the
# same checks locally, so a failure in one does not hide the others.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format, generated files, contracts, boundaries and analyze
        run: dart run tool/ci_check.dart checks

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run unit and widget tests
        run: dart run tool/ci_check.dart tests --report

      - name: Save informational test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-correctness-coverage
          path: |
            coverage/lcov.info
            build/test-timings.json
            build/test-results.jsonl
          if-no-files-found: warn

  integration-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install Linux integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb

      - name: Run native navigation, Core add and persistence flows
        run: xvfb-run -a dart run tool/ci_check.dart integration --device linux

  test-windows-fonts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
      - run: flutter pub get --enforce-lockfile
      - name: Verify native Windows font selection
        run: flutter test integration_test/font_rendering_test.dart -d windows

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build web
        run: flutter build web --release

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: flutter build macos --release
