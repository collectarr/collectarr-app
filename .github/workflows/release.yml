name: Release

# One run publishes a release: Prepare picks the version from the
# conventional commits since the last tag, moves the Unreleased changelog
# entries under it, commits and tags that on main and creates the GitHub
# release with those entries as notes; the jobs below build and attach the
# downloads. Pushing to the protected main branch needs the RELEASE_TOKEN
# secret (see docs/versioning-policy.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release without leading v; empty picks it from the commits
        required: false
        type: string
      dry_run:
        description: Only show the version and notes the release would get
        required: false
        default: false
        type: boolean
      backfill_version:
        description: Rebuild and attach the downloads of an existing release (version without v)
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  METADATA_BASE_URL: ${{ secrets.COLLECTARR_METADATA_BASE_URL || 'http://127.0.0.1:8010' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.result.outputs.version }}
      publish: ${{ steps.result.outputs.publish }}
    steps:
      - name: Require the release token
        if: inputs.backfill_version == '' && !inputs.dry_run
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error title=Missing RELEASE_TOKEN::Add a token that may push to main as the RELEASE_TOKEN secret (docs/versioning-policy.md)."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: inputs.backfill_version == ''
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Set up Flutter
        if: inputs.backfill_version == ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        if: inputs.backfill_version == ''
        run: flutter pub get --enforce-lockfile

      - name: Prepare version, changelog and notes
        id: prepare
        if: inputs.backfill_version == ''
        run: |
          args=(--notes "$RUNNER_TEMP/release-notes.md")
          if [ -n "${{ inputs.version }}" ]; then args+=(--version "${{ inputs.version }}"); fi
          dart run tool/prepare_release.dart "${args[@]}"
          {
            echo "## v$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -1)"
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag and push
        if: inputs.backfill_version == '' && !inputs.dry_run
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Create the GitHub release
        if: inputs.backfill_version == '' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          channel=--latest
          if [[ "$VERSION" == *-* ]]; then channel=--prerelease; fi
          gh release create "v$VERSION" --verify-tag "$channel"             --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Result
        id: result
        run: |
          if [ -n "${{ inputs.backfill_version }}" ]; then
            echo "version=${{ inputs.backfill_version }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ !inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

  release-web:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build web bundle
        run: |
          flutter build web --release             --dart-define=COLLECTARR_API_BASE_URL=$METADATA_BASE_URL

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/collectarr-app-web:v${{ needs.prepare.outputs.version }}
            ${{ !contains(needs.prepare.outputs.version, '-') && format('ghcr.io/{0}/collectarr-app-web:latest', github.repository_owner) || '' }}

      - name: Upload web bundle asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          (cd build/web && zip -r ../../dist/collectarr-web-v${RELEASE_VERSION}.zip .)
          gh release upload "v${RELEASE_VERSION}" "dist/collectarr-web-v${RELEASE_VERSION}.zip" --clobber

  release-android:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build Android artifacts
        run: |
          flutter build apk --release --dart-define=COLLECTARR_API_BASE_URL=$METADATA_BASE_URL

      - name: Upload Android assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/collectarr-android-v${RELEASE_VERSION}.apk
          gh release upload "v${RELEASE_VERSION}" dist/collectarr-android-v${RELEASE_VERSION}.apk --clobber

  release-windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build Windows app
        run: flutter build windows --release "--dart-define=COLLECTARR_API_BASE_URL=$env:METADATA_BASE_URL"

      - name: Optionally sign Windows binaries
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.COLLECTARR_WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.COLLECTARR_WINDOWS_SIGN_PFX_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.COLLECTARR_WINDOWS_SIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGN_CERT_PASSWORD)) {
            Write-Output "Signing secrets not configured; publishing unsigned Windows binaries."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "collectarr-signing.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:SIGN_CERT_BASE64))

          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe not found in Windows SDK."
          }

          $targets = Get-ChildItem "build/windows/x64/runner/Release" -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }
          foreach ($target in $targets) {
            & $signTool.FullName sign /fd SHA256 /f $certPath /p $env:SIGN_CERT_PASSWORD /tr $env:SIGN_TIMESTAMP_URL /td SHA256 $target.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to sign $($target.FullName)"
            }
          }

          Remove-Item $certPath -Force

      - name: Package Windows portable artifact
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/collectarr-windows-portable-v$env:RELEASE_VERSION.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $iss = @"
          [Setup]
          AppId={{4A0B73CB-02AA-4D1D-8A20-1D2B4F6E31C3}
          AppName=Collectarr
          AppVersion=$env:RELEASE_VERSION
          DefaultDirName={autopf}\Collectarr
          DefaultGroupName=Collectarr
          OutputDir=dist
          OutputBaseFilename=collectarr-windows-installer-v$env:RELEASE_VERSION
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "build\\windows\\x64\\runner\\Release\\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{group}\\Collectarr"; Filename: "{app}\\collectarr_app.exe"
          Name: "{group}\\Uninstall Collectarr"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\\collectarr_app.exe"; Description: "Launch Collectarr"; Flags: nowait postinstall skipifsilent
          "@
          $issPath = "collectarr-installer.iss"
          Set-Content -Path $issPath -Value $iss -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
          Remove-Item $issPath -Force

      - name: Upload Windows asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "v$env:RELEASE_VERSION" `
            "dist/collectarr-windows-portable-v$env:RELEASE_VERSION.zip" `
            "dist/collectarr-windows-installer-v$env:RELEASE_VERSION.exe" `
            --clobber

  release-macos:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && vars.COLLECTARR_ENABLE_MACOS_RELEASE == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build macOS app
        run: flutter build macos --release --dart-define=COLLECTARR_API_BASE_URL=$METADATA_BASE_URL

      - name: Package macOS portable artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "::error title=Missing macOS app bundle::Could not find built .app in build/macos/Build/Products/Release"
            exit 1
          fi
          ditto -c -k --keepParent "$app_path" "dist/collectarr-macos-portable-v${RELEASE_VERSION}.zip"

      - name: Package macOS installer
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "::error title=Missing macOS app bundle::Could not find built .app in build/macos/Build/Products/Release"
            exit 1
          fi
          hdiutil create -volname "Collectarr" -srcfolder "$app_path" -ov -format UDZO "dist/collectarr-macos-installer-v${RELEASE_VERSION}.dmg"

      - name: Upload macOS asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          gh release upload "v${RELEASE_VERSION}" \
            "dist/collectarr-macos-portable-v${RELEASE_VERSION}.zip" \
            "dist/collectarr-macos-installer-v${RELEASE_VERSION}.dmg" \
            --clobber

  release-linux:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build Linux app
        run: flutter build linux --release --dart-define=COLLECTARR_API_BASE_URL=$METADATA_BASE_URL

      - name: Package Linux portable artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf "dist/collectarr-linux-portable-v${RELEASE_VERSION}.tar.gz" bundle

      - name: Package Linux installer (.deb)
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p pkgroot/DEBIAN pkgroot/usr/lib/collectarr-app pkgroot/usr/bin
          cp -a build/linux/x64/release/bundle/. pkgroot/usr/lib/collectarr-app/
          executable="$(find pkgroot/usr/lib/collectarr-app -maxdepth 1 -type f -executable | head -n 1 | xargs basename)"
          if [ -z "$executable" ]; then
            echo "::error title=Missing Linux binary::Could not detect executable in linux bundle"
            exit 1
          fi
          cat > pkgroot/DEBIAN/control <<EOF
          Package: collectarr-app
          Version: ${RELEASE_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Collectarr
          Description: Collectarr desktop application
          EOF
          cat > pkgroot/usr/bin/collectarr-app <<EOF
          #!/usr/bin/env bash
          exec /usr/lib/collectarr-app/${executable} "\$@"
          EOF
          chmod 755 pkgroot/usr/bin/collectarr-app
          dpkg-deb --build pkgroot "dist/collectarr-linux-installer-v${RELEASE_VERSION}.deb"

      - name: Upload Linux assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          gh release upload "v${RELEASE_VERSION}" \
            "dist/collectarr-linux-portable-v${RELEASE_VERSION}.tar.gz" \
            "dist/collectarr-linux-installer-v${RELEASE_VERSION}.deb" \
            --clobber
