name: collectarr_app
description: Offline-first Collectarr metadata and library client.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  drift: ^2.35.2
  web: ^1.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^11.0.0
  sqlite3: ^3.7.0
  uuid: ^4.5.1
  mobile_scanner: ^7.4.0
  cached_network_image: ^4.0.0
  image_picker: ^1.1.2
  image: ^4.9.2
  google_mlkit_text_recognition: ^0.17.1
  csv: ^8.0.0
  archive: ^4.0.9
  crypto: ^3.0.6
  file_selector: ^1.0.3
  desktop_drop: ^0.8.4
  pasteboard: ^0.5.0
  qr_flutter: ^4.1.0
  xml: ^7.0.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.15.0
  barcode: ^2.2.8
  go_router: ^18.1.0
  flutter_svg: ^2.3.0
  country_iso: ^1.0.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  analyzer: ^14.5.0
  vm_service: ^15.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logos/
    - assets/collection_status/
    - assets/import_logos/
    - web/icons/Icon-maskable-192.png
    - assets/fonts/PlusJakartaSans-OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
